name: Build Windows Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build (NSIS + MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.1.0
          releaseBody: |
            Desktop IT security audit toolkit for small business IT departments. Run four audits, export a scored report, done.

            **Audit modules**
            - DNS / Email Security — SPF, real DKIM (selector resolved from DMARC, `p=` policy check), DMARC, MX record validation
            - SSL / TLS — cert expiry, HTTPS redirect, chain validation, HTTP security headers (HSTS, CSP, X-Frame-Options, X-Content-Type-Options)
            - Firewall Config — allow-all rules, weak protocols, exposed ports
            - Port Scanner — 25 common ports with per-port security assessments, incl. Docker 2375, Redis 6379, memcached 11211, Elasticsearch 9200, MongoDB 27017

            **Risk scoring** — every audit produces a 0-100 risk score with executive summary and findings by severity (Low / Moderate / High / Critical).

            **New in v1.1.0**
            - Persistent audit history (last 100 runs, survives restarts, one-click clear)
            - CSV export alongside TXT / JSON
            - Fresh UI — glassmorphism panels, gradient accents, animated cards

            ### Linux
            Download the AppImage, make it executable (`chmod +x`), and run it.

            ### Windows
            Download the `.exe` installer (NSIS). The `.msi` is also available for enterprise deployment.

            Built with Rust + Tauri v2.

          args: --bundles nsis,msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
